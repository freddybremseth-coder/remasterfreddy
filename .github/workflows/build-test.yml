name: Re-Master build and tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/check-api-syntax.mjs
      - run: npm run build
      - run: npm test
