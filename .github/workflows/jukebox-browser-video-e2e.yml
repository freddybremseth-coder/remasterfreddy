name: Jukebox real browser video with audio smoke
on:
  pull_request:
    paths:
      - 'src/lib/jukebox-browser-render.ts'
      - 'src/lib/jukebox-browser-render.test.ts'
      - 'scripts/test-jukebox-browser-video-e2e.mjs'
      - '.github/workflows/jukebox-browser-video-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-video-with-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install isolated browser smoke dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install headless browser and ffprobe
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Produce actual local video and decode both tracks
        run: node scripts/test-jukebox-browser-video-e2e.mjs
      # Uses synthesized WAV + generated PNG, no production credentials
      # and no third-party media, service keys, YouTube or live job mutations.
